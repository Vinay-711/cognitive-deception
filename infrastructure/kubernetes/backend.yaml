apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognitive-backend
  namespace: cognitive-deception
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cognitive-backend
  template:
    metadata:
      labels:
        app: cognitive-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/example/cognitive-deception-backend:latest
          ports:
            - containerPort: 8000
          envFrom:
            - configMapRef:
                name: cognitive-deception-config
          env:
            - name: DATABASE_URL
              value: postgresql+psycopg2://cognitive:secret@postgres.cognitive-deception.svc.cluster.local:5432/cognitive
            - name: REDIS_URL
              value: redis://redis.cognitive-deception.svc.cluster.local:6379/0
            - name: KAFKA_BOOTSTRAP_SERVERS
              value: kafka.cognitive-deception.svc.cluster.local:9092
            - name: ELASTICSEARCH_URL
              value: http://elasticsearch.cognitive-deception.svc.cluster.local:9200
            - name: NEO4J_URI
              value: bolt://neo4j.cognitive-deception.svc.cluster.local:7687
---
apiVersion: v1
kind: Service
metadata:
  name: cognitive-backend
  namespace: cognitive-deception
spec:
  selector:
    app: cognitive-backend
  ports:
    - port: 8000
      targetPort: 8000

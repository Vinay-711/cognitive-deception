apiVersion: apps/v1
kind: Deployment
metadata:
  name: cognitive-frontend
  namespace: cognitive-deception
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cognitive-frontend
  template:
    metadata:
      labels:
        app: cognitive-frontend
    spec:
      containers:
        - name: frontend
          image: ghcr.io/example/cognitive-deception-frontend:latest
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_BASE_URL
              value: http://cognitive-backend.cognitive-deception.svc.cluster.local:8000/api/v1
---
apiVersion: v1
kind: Service
metadata:
  name: cognitive-frontend
  namespace: cognitive-deception
spec:
  selector:
    app: cognitive-frontend
  ports:
    - port: 3000
      targetPort: 3000

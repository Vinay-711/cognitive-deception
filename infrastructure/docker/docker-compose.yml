services:
  backend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/backend.Dockerfile
    env_file:
      - ../../backend/.env.example
    environment:
      DATABASE_URL: postgresql+psycopg2://cognitive:secret@postgres:5432/cognitive
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      ELASTICSEARCH_URL: http://elasticsearch:9200
      NEO4J_URI: bolt://neo4j:7687
      ENABLE_KAFKA: "true"
      ENABLE_ELASTIC: "true"
      ENABLE_NEO4J: "true"
      ENABLE_REDIS: "true"
    depends_on:
      - postgres
      - redis
      - kafka
      - elasticsearch
      - neo4j
      - cowrie
      - dionaea
      - web-honeypot
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ../..
      dockerfile: infrastructure/docker/frontend.Dockerfile
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000/api/v1
    depends_on:
      - backend
    ports:
      - "3000:3000"

  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cognitive
      POSTGRES_PASSWORD: secret
      POSTGRES_DB: cognitive
    volumes:
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  zookeeper:
    image: bitnamilegacy/zookeeper:3.9.3-debian-12-r22
    environment:
      ALLOW_ANONYMOUS_LOGIN: "yes"
    ports:
      - "2181:2181"

  kafka:
    image: bitnamilegacy/kafka:3.3.2-debian-11-r11
    platform: linux/amd64
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      ALLOW_PLAINTEXT_LISTENER: "yes"

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.1
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"

  neo4j:
    image: neo4j:5.24
    environment:
      NEO4J_AUTH: neo4j/changeme
    ports:
      - "7474:7474"
      - "7687:7687"

  cowrie:
    build:
      context: ../..
      dockerfile: infrastructure/docker/honeypot.Dockerfile
    environment:
      MODE: ssh
      PORT: "2222"
      CHANNEL: ssh
      API_BASE: http://backend:8000/api/v1
    ports:
      - "2222:2222"

  dionaea:
    build:
      context: ../..
      dockerfile: infrastructure/docker/honeypot.Dockerfile
    environment:
      MODE: tcp
      PORT: "4444"
      CHANNEL: dionaea
      API_BASE: http://backend:8000/api/v1
    ports:
      - "4444:4444"

  web-honeypot:
    build:
      context: ../..
      dockerfile: infrastructure/docker/honeypot.Dockerfile
    environment:
      MODE: http
      PORT: "8081"
      CHANNEL: http
      API_BASE: http://backend:8000/api/v1
    ports:
      - "8081:8081"
